# /etc/nginx/sites-available/shop-tools.ali-moradi-develop.com
# certbot --nginx adds the TLS server block and the HTTP→HTTPS redirect.
server {
    listen 80;
    server_name shop-tools.ali-moradi-develop.com;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the storefront passes this on to the API for its rate limits;
        # always overwrite it so visitors cannot choose their own IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
