# Production stack for /srv/apps/shop-tools/compose.yaml (roadmap phase 8).
# Images are built in CI and pulled here; secrets live in .env next to this file.
name: shop-tools

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: toolbench
      MYSQL_USER: toolbench
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]
    # no published ports: only the API reaches the database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  api:
    image: ghcr.io/ali-moradi-design/shop-tools-api:${TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://toolbench:${MYSQL_PASSWORD}@mysql:3306/toolbench
      CORS_ORIGIN: https://shop-tools.ali-moradi-develop.com
      # one proxy hop in front of the API: the storefront's /api route
      TRUST_PROXY: 1
    volumes:
      - uploads:/app/uploads
    networks: [backend, frontend]
    # apply the migrations, then start (the image carries the Prisma CLI and schema)
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    restart: unless-stopped

  web:
    image: ghcr.io/ali-moradi-design/shop-tools-web:${TAG:-latest}
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: https://shop-tools.ali-moradi-develop.com
    # Nginx on the host proxies to this; Docker bypasses ufw, so bind to localhost only
    ports:
      - "127.0.0.1:3105:3000"
    networks: [frontend]
    depends_on: [api]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    restart: unless-stopped

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  mysql-data:
  uploads:
